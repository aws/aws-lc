# Rust code in libcrypto, folded in as bcm-rust.o. It is written as FIPS
# module code. CMake builds it when it finds Rust, unless configured with
# -DENABLE_RUST=OFF; see cmake/cargo.cmake.

[package]
name = "bcm-rust"
version = "0.1.0"
edition = "2024"
# cmake/cargo.cmake checks the same minimum.
rust-version = "1.85"
license = "Apache-2.0 OR ISC"
publish = false

# A workspace of its own, so Cargo doesn't count the crate as a member of an
# enclosing workspace, such as aws-lc-rs's, which holds AWS-LC as a submodule.
[workspace]

[lib]
crate-type = ["staticlib"]

# CMake sets these cfgs (src/lib.rs). awslc_fips makes the crate a FIPS
# module of its own, in FIPS builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(awslc_prefix)", "cfg(awslc_asm)", "cfg(awslc_no_avx)", "cfg(awslc_fips)"] }

# The staticlib is linked into libcrypto, which has no Rust runtime to unwind
# into. Unwinding across the C ABI is undefined behaviour, so abort instead.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
