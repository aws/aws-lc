name: autofix

on:
  workflow_run:
    workflows: ["integration-omnibus"]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  WORK_DIR: ${{ github.workspace }}/autofix-work

jobs:
  get-failing-integrations:
    name: get-failing-integrations
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &install
        run: python3 -m pip install -r tests/ci/integration/autofix/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-failure-*
          path: autofix-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Collect failing targets
        id: targets
        working-directory: tests/ci/integration
        env:
          AWSLC_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "targets=$(python3 -m autofix recognize "$GITHUB_WORKSPACE/autofix-reports")" >> "$GITHUB_OUTPUT"
      - name: Download each failing integration's logs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -o pipefail
          for log in $(jq -r '.[] | "\(.name)/\(.target.environments[].job_id | select(. != 0))"' <<< "$TARGETS"); do
            target=${log%/*} job_id=${log#*/}
            mkdir -p "autofix/$target"
            # Drop ANSI color codes, then every byte that is not tab, newline, or printable ASCII.
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
              | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | tr -cd '\t\n -~' > "autofix/$log.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-logs
          # Save the logs folder so the `reason` job find the logs.
          path: autofix/
          if-no-files-found: ignore

  reason:
    name: reason (${{ matrix.name }})
    needs: get-failing-integrations
    if: needs.get-failing-integrations.outputs.targets != '[]'
    strategy: &per-target
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.get-failing-integrations.outputs.targets) }}
    runs-on: &codebuild
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.arch == 'aarch64' && 'arm-3.0' || 'linux-5.0' }}
        instance-size:${{ matrix.size }}
    permissions: &oidc
      contents: read
      id-token: write
    env: &target
      TARGET: ${{ toJSON(matrix.target) }}
    steps:
      - *checkout
      - *install
      - uses: actions/download-artifact@v8
        with:
          name: autofix-logs
          path: autofix
      - env:
          NAME: ${{ matrix.name }}
        run: mkdir -p "$WORK_DIR/out" && mv "autofix/$NAME" "$WORK_DIR/out/logs"
      # Log in to ECR with the runner's own role to pull the CI images, which the Bedrock role cannot pull.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Pull this arch's CI images and log out of ECR before the agent starts
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          for image in $(jq -r --arg arch "$(uname -m)" '[.environments[] | select(.arch == $arch).image] | unique[]' <<< "$TARGET"); do
            docker pull -q "$ECR_REGISTRY/aws-lc/$image"
          done
          docker logout "$ECR_REGISTRY"
      - &bedrock-region
        name: Load shared Bedrock settings
        run: jq -r '"AWS_REGION=\(.aws_region)"' .github/workflows/ai-config.json >> "$GITHUB_ENV"
      - &bedrock
        uses: ./.github/actions/configure-aws-credentials
        with:
          oidcRole: AwsLcGitHubActionsAutofixOidcRole
          roleName: AwsLcGitHubActionsBedrockRole
      - name: Block containers from the instance and CodeBuild credential endpoints
        run: |
          sudo iptables -I DOCKER-USER -d 169.254.169.254 -j DROP
          sudo iptables -I DOCKER-USER -d 169.254.170.2 -j DROP
      - name: Fix the integration and replay the fix
        working-directory: tests/ci/integration
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: python3 -m autofix reason
      - &upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autofix-${{ matrix.name }}
          path: ${{ env.WORK_DIR }}/out/
          overwrite: true

  review:
    name: review (${{ matrix.name }})
    needs: [get-failing-integrations, reason]
    if: ${{ !cancelled() && needs.reason.result != 'skipped' }}
    strategy: *per-target
    runs-on: *codebuild
    timeout-minutes: 60
    permissions: *oidc
    env: *target
    steps:
      - *checkout
      - *install
      - uses: actions/download-artifact@v8
        with:
          name: autofix-${{ matrix.name }}
          path: ${{ env.WORK_DIR }}/out/
      - *bedrock-region
      - *bedrock
      - name: Review the fix
        working-directory: tests/ci/integration
        run: python3 -m autofix review
      - *upload

  resolve:
    needs: [get-failing-integrations, review]
    if: ${{ !cancelled() && needs.review.result != 'skipped' }}
    permissions: *oidc
    uses: ./.github/workflows/autofix_resolve.yml
    with:
      targets: ${{ needs.get-failing-integrations.outputs.targets }}
