name: clang-tidy-review
on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.18'
      - uses: ZedThree/clang-tidy-review@438014136def4cb6242e9d0ef3da1a1cd48fa7ce # v0.23.1
        with:
          apt_packages: libssl-dev
          split_workflow: true
          clang_tidy_version: 21
          install_commands: >-
            /github/workspace/util/build_compilation_database.sh
            -DBUILD_AWSLC_PROVIDER=ON
            -DBUILD_SHARED_LIBS=ON
          config_file: '/github/workspace/.clang-tidy'
          # Generated table fragment included only by obj.c; not self-contained.
          exclude: 'crypto/obj/obj_dat.h'
      - uses: ZedThree/clang-tidy-review/upload@438014136def4cb6242e9d0ef3da1a1cd48fa7ce # v0.23.1
