name: clang-tidy-post

on:
  workflow_run:
    workflows: ["clang-tidy-review"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: ZedThree/clang-tidy-review/post@4ea7f7b72e7e039588ef5e64de9a845e5a3f8db5 # v0.21.0
        with:
          lgtm_comment_body: '' # An empty string means it won't post a LGTM message
          annotations: false
          max_comments: 10
