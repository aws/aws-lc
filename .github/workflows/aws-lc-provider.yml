name: aws-lc-provider Tests
on:
  push:
    branches: ["main", "fips-*"]
  pull_request:
    branches: ["*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

jobs:
  aws-lc-provider-linux:
    name: aws-lc-provider Linux FIPS=${{ matrix.fips }}
    if: github.repository_owner == 'aws'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fips: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.18"
      - name: Install OS Dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none -o Acquire::Translation=none
          sudo apt-get -y --no-install-recommends install \
            cmake ninja-build make perl binutils
      - name: Build the provider, run its unit tests and EVP vectors
        run: |
          if [[ "${{ matrix.fips }}" == "1" ]]; then
            ./tests/ci/run_aws_lc_provider_tests.sh --fips
          else
            ./tests/ci/run_aws_lc_provider_tests.sh
          fi
