name: android-omnibus
on:
  push:
    branches: ["main", "fips-*"]
  pull_request_target:
    branches: ["*"]
concurrency:
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name == 'pull_request_target'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}', github.ref_type || 'ref', github.ref_name || github.ref) }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
permissions:
  id-token: write
  contents: read

jobs:
  authorization-check:
    outputs:
      approval-env: ${{ steps.authz.outputs.approval-env }}
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-authorization
        id: authz

  maintainer-approval:
    needs: authorization-check
    runs-on: ubuntu-latest
    # This job exists only to pause the run on the manual-approval gate.
    # It waits until a maintainer approves, so its token sits idle in the runner during that window.
    # Empty permissions strip that token to zero scopes, so the waiting job can never touch AWS or the repo.
    permissions: {}
    environment: ${{ needs.authorization-check.outputs.approval-env == 'manual-approval' && 'manual-approval' || '' }}
    steps:
      - run: "true"

  device-farm:
    name: android-${{ matrix.fips && 'fips-' || '' }}${{ matrix.release && 'release' || 'debug' }}-${{ matrix.shared && 'shared' || 'static' }}
    needs: [authorization-check, maintainer-approval]
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:medium
    strategy:
      matrix:
        fips: [false, true]
        release: [false, true]
        shared: [false, true]
        exclude:
          - fips: true
            release: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # Safe: this job's fork checkout is gated behind the
          # maintainer-approval deployment-environment approval (AWS-542), so
          # fork code is only checked out after a maintainer approves the run.
          # That approval gate is exactly the human-in-the-loop mitigation that
          # actions/checkout@v7's new pull_request_target default requires; this
          # opt-in re-asserts our existing protection, it does not weaken it.
          allow-unsafe-pr-checkout: true
      - name: Query Environment
        id: env
        run: |
          echo staging_url=${ECR_STAGING_REPO} >> "$GITHUB_OUTPUT"
      - name: Retrieve Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionDeviceFarmRole
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: ./.github/actions/codebuild-docker-run
        name: Build Test APKs
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/android:latest
          run: |
            chmod +x ./tests/ci/android/AWSLCAndroidTestRunner/gradlew
            cd ./tests/ci
            python3 -m venv .env && . .env/bin/activate && pip install -r requirements.txt
            ./kickoff_devicefarm_job.sh \
            --fips ${{ matrix.fips }} \
            --release ${{ matrix.release }} \
            --shared ${{ matrix.shared }} \
            --action build
      # The Device Farm role is assumed by role chaining, which caps its credentials at one hour, while
      # a run can take longer than that when devices are busy. So credentials are refreshed before each
      # step that talks to Device Farm, and each such step is limited to 50 minutes. A Device Farm run that
      # may still be in progress is recorded in tests/ci/devicefarm-run.json.
      - name: Refresh Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionDeviceFarmRole
      - uses: ./.github/actions/codebuild-docker-run
        name: Run Device Farm Tests
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/android:latest
          withCredentials: true
          run: |
            cd ./tests/ci
            . .env/bin/activate
            ./kickoff_devicefarm_job.sh \
            --test-name "AWS-LC Android GitHub Action ${{ github.run_id }}-${{ github.run_attempt }}" \
            --fips ${{ matrix.fips }} \
            --release ${{ matrix.release }} \
            --shared ${{ matrix.shared }} \
            --max-wait-minutes 50 \
            --resumable \
            --action run-job
      - name: Refresh Credentials to Continue Waiting
        if: hashFiles('tests/ci/devicefarm-run.json') != ''
        uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionDeviceFarmRole
      - uses: ./.github/actions/codebuild-docker-run
        name: Continue Waiting for Device Farm Tests
        if: hashFiles('tests/ci/devicefarm-run.json') != ''
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/android:latest
          withCredentials: true
          run: |
            cd ./tests/ci
            . .env/bin/activate
            python3 -u ./devicefarm_job.py wait --max-wait-minutes 50
      # Nothing else stops a Device Farm run when this job fails or is cancelled (for example by a newer
      # push to the same pull request), and an abandoned run keeps holding devices that later runs wait for.
      - name: Refresh Credentials to Stop Device Farm Run
        if: (failure() || cancelled()) && hashFiles('tests/ci/devicefarm-run.json') != ''
        uses: ./.github/actions/configure-aws-credentials
        with:
          roleName: AwsLcGitHubActionDeviceFarmRole
      - uses: ./.github/actions/codebuild-docker-run
        name: Stop Device Farm Run
        if: (failure() || cancelled()) && hashFiles('tests/ci/devicefarm-run.json') != ''
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/aws-lc/android:latest
          withCredentials: true
          run: |
            cd ./tests/ci
            . .env/bin/activate
            python3 -u ./devicefarm_job.py stop
