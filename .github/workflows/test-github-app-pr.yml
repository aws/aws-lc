name: test-github-app-pr

# Trigger the workflow when a pull request is opened or updated
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read   # all writes below use the App token, not GITHUB_TOKEN

jobs:
  open-pr:
    # CRITICAL: Prevents an infinite loop by blocking the App from triggering its own workflow
    if: github.actor != 'acl-ci[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ACL_CI_APP_ID }}
          private-key: ${{ secrets.ACL_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # CRITICAL: Checks out the actual source branch so 'git push' works properly
          ref: ${{ github.head_ref }}

      - name: Create a branch and open a draft PR as the app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="acl-ci-app-test-${GITHUB_RUN_ID}"
          git config user.name  "acl-ci[bot]"
          git config user.email "329743683+acl-ci[bot]@users.noreply.github.com"
          
          # Creates and switches to your new automation branch smoothly
          git checkout -b "$BRANCH"
          
          printf 'acl-ci GitHub App connectivity test: %s\n' "$(date -u)" > ACL_CI_APP_TEST.md
          git add ACL_CI_APP_TEST.md
          git commit -m "TEST: from github app"
          git push origin "$BRANCH"
          
          gh pr create \
            --draft \
            --title "TEST: Github app" \
            --body "This PR was generated by the acl-ci GitHub App." \
            --base main \
            --head "$BRANCH"
