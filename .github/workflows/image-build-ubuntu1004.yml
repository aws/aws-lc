name: image-build-ubuntu1004
on:
  workflow_call:
    inputs:
      concurrency_prefix:
        default: image-build-ubuntu1004
        required: false
        type: string
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/docker_images/aws-lc/ubuntu/Dockerfile.1004
      - .github/docker_images/scripts/**
  pull_request:
    branches: [main]
    paths:
      - .github/docker_images/aws-lc/ubuntu/Dockerfile.1004
      - .github/docker_images/scripts/**
concurrency:
  group: ${{ inputs.concurrency_prefix || github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
  DOCKER_BUILD_RECORD_UPLOAD: false
permissions:
  contents: read

jobs:
  x86_64_build:
    runs-on:
      codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      image:linux-5.0
      instance-size:medium
    outputs:
      ubuntu1004: ${{ steps.images.outputs.ubuntu1004 }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Get ECR Registry & Repository Details
        id: ecr
        run: |
          echo staging_url=${ECR_STAGING_REPO} >> "$GITHUB_OUTPUT"
      - name: Generate Staging Image Names
        id: images
        run: |
          echo ubuntu1004=${{ steps.ecr.outputs.staging_url }}:$(uuidgen) >> "$GITHUB_OUTPUT"
      - name: Get CMake v3.9.6 and Rust 1.63.0 Sources
        id: dependencies
        run: |
          temp_dir="$(mktemp -d)"
          curl -L -o cmake-3.9.6.tar.gz --output-dir "${temp_dir}" \
            https://github.com/Kitware/CMake/releases/download/v3.9.6/cmake-3.9.6.tar.gz
          # Rust 1.63.0 is the last release that runs on this image's glibc 2.11,
          # and it has to be fetched here because the image's TLS stack is too old
          # to reach static.rust-lang.org itself.
          rust_tarball="rust-1.63.0-x86_64-unknown-linux-gnu.tar.gz"
          curl -L -o "${rust_tarball}" --output-dir "${temp_dir}" \
            "https://static.rust-lang.org/dist/${rust_tarball}"
          # Expected digest is from the release's companion .sha256 file:
          # https://static.rust-lang.org/dist/rust-1.63.0-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "536bcf16807a4ff49b7b29af6e573a2f1821055bfad72c275c60e56edc693984  ${temp_dir}/${rust_tarball}" \
            | sha256sum -c -
          echo directory=${temp_dir} >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Import ubuntu:10.04 OCI Image
        run: |
          temp_dir="$(mktemp -d)"
          curl -o container.tar --output-dir "${temp_dir}" https://d2yr98kym3baw0.cloudfront.net/ubuntu1004.tar
          docker load < "${temp_dir}/container.tar"
      - uses: docker/build-push-action@v7
        with:
          file: ./.github/docker_images/aws-lc/ubuntu/Dockerfile.1004
          context: ./.github/docker_images/aws-lc/ubuntu
          build-contexts: |
            scripts=./.github/docker_images/scripts
            dependencies=${{ steps.dependencies.outputs.directory }}
          tags: ${{ steps.images.outputs.ubuntu1004 }}
          push: true
      - uses: ./.github/actions/codebuild-docker-run
        name: Validate Container
        with:
          image: ${{ steps.images.outputs.ubuntu1004 }}
          run: |
            ./.github/docker_images/scripts/verify-cmake-version.sh cmake 3.9
            ./.github/docker_images/scripts/verify-perl-version.sh 5.10
            # Rust is pinned here: 1.63.0 is the last release supporting glibc < 2.17
            ./.github/docker_images/scripts/verify-rust-version.sh rustc 1.63
            ./.github/docker_images/scripts/verify-rust-version.sh cargo 1.63
            # rustfmt versions independently of rustc (1.63 ships rustfmt 1.5.x), so no pin
            ./.github/docker_images/scripts/verify-rust-version.sh rustfmt
            # Check GCC 4.1 Compilers
            source /opt/compiler-env/setup-gcc-4.1.sh
            ./.github/docker_images/scripts/verify-compiler-version.sh $CC gcc 4.1
            ./.github/docker_images/scripts/verify-compiler-version.sh $CXX g++ 4.1
  x86_64_push:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
      codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      image:linux-5.0
      instance-size:small
    needs:
      - x86_64_build
    steps:
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Get ECR Registry & Repository Details
        id: ecr
        run: |
          echo registry_url=${ECR_REGISTRY_URL} >> "$GITHUB_OUTPUT"
      - name: Generate Staging Image Names
        id: images
        run: |
          echo ubuntu1004=${{ steps.ecr.outputs.registry_url }}/aws-lc/ubuntu:10.04 >> "$GITHUB_OUTPUT"
      - name: Pull Images From Staging
        run: |
          docker pull ${{ needs.x86_64_build.outputs.ubuntu1004 }}
      - name: Tag Images
        run: |
          docker tag ${{ needs.x86_64_build.outputs.ubuntu1004 }} ${{ steps.images.outputs.ubuntu1004 }}
      - name: Push Images
        run: |
          docker push ${{ steps.images.outputs.ubuntu1004 }}
