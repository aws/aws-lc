name: BSD CI Tests
on:
  push:
    branches: ["main", "fips-*"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: '0 8 * * *'
concurrency:
  # The event name keeps a push to main from cancelling the nightly scheduled run (and with it the
  # failure metric published by report-failures) when the two coincide.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  GOPROXY: https://proxy.golang.org,direct
  PACKAGE_NAME: aws-lc

permissions:
  contents: read

# BSD CI Strategy:
# - FreeBSD x86-64: scheduled(daily) + on every PR(with slow tests disabled)
# - FreeBSD arm64: schedule only (daily)
# - OpenBSD: schedule only (daily)
# - NetBSD: schedule only (daily)
# Full test suite (including slow tests) runs on the daily schedule.
#
# Each lane boots its VM in a "Start VM" step and then runs the remaining steps inside the VM through
# the cpa.sh shell that cross-platform-actions/action puts on the PATH. Keeping VM provisioning and
# dependency installation in their own steps lets report-failures tell a lane that never reached
# the tests (a VM image download or package mirror outage) apart from a genuine test failure. The
# values of the variables named in environment_variables are read from the environment of each
# step that runs in the VM, so they are set at the job level rather than on the Start VM step.

jobs:
  freebsd:
    if: github.repository_owner == 'aws'
    runs-on: ubuntu-latest
    name: FreeBSD ${{ matrix.version }} (${{ matrix.arch }}) test
    strategy:
      fail-fast: false
      matrix:
        arch:
          - "x86-64"
        version:
          - "14.2"
          - "15.0"
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"arch":"arm64","version":"14.2"},{"arch":"arm64","version":"15.0"}]') || fromJSON('[]') }}
    defaults:
      run:
        shell: cpa.sh {0}
    env:
      AWS_LC_GO_TEST_TIMEOUT: 90m
      AWS_LC_SSL_RUNNER_IDLE_TIMEOUT: 120s
      AWS_LC_SSL_RUNNER_RETRY_ON_TIMEOUT: 1
      AWS_LC_NO_SLOW_TESTS: ${{ github.event_name != 'schedule' && '1' || '0' }}
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Start VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          environment_variables: "AWS_LC_GO_TEST_TIMEOUT AWS_LC_SSL_RUNNER_IDLE_TIMEOUT AWS_LC_SSL_RUNNER_RETRY_ON_TIMEOUT AWS_LC_NO_SLOW_TESTS GOFLAGS"
          operating_system: freebsd
          architecture: ${{ matrix.arch }}
          version: ${{ matrix.version }}
          shell: bash
          memory: 12G
          cpu_count: 3
      - name: Install dependencies
        run: |
          source tests/ci/retry_util.sh
          retry_with_backoff sudo pkg install -y git gmake cmake go ninja
      - name: Run tests
        run: tests/ci/run_bsd_tests.sh

  OpenBSD:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: OpenBSD ${{ matrix.version }} (${{ matrix.arch }}) test
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86-64", "arm64"]
        version: ["7.5", "7.6"]
    defaults:
      run:
        shell: cpa.sh {0}
    env:
      AWS_LC_GO_TEST_TIMEOUT: 120m
    steps:
      - uses: actions/checkout@v7
      - name: Start VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641
        with:
          environment_variables: AWS_LC_GO_TEST_TIMEOUT
          operating_system: openbsd
          cpu_count: 3
          memory: 12G
          architecture: ${{ matrix.arch }}
          version: "${{ matrix.version }}"
          shell: bash
      - name: Install dependencies
        run: |
          set -x
          source tests/ci/retry_util.sh
          retry_with_backoff sudo pkg_add cmake ninja go gmake
          mkdir "${HOME}/bin"
          ln -s /usr/local/bin/gmake "${HOME}/bin/make"
      - name: Configure VM
        run: |
          set -x
          sudo pfctl -d
          cat << EOF | sudo tee /etc/login.conf.d/unlimited
          unlimited:\
              :datasize-cur=infinity:\
              :datasize-max=infinity:\
              :stacksize-cur=infinity:\
              :stacksize-max=infinity:\
              :memoryuse-cur=infinity:\
              :memoryuse-max=infinity:\
              :maxproc-cur=infinity:\
              :maxproc-max=infinity:\
              :openfiles-cur=infinity:\
              :openfiles-max=infinity:\
              :cpuuse-cur=infinity:\
              :cpuuse-max=infinity:\
              :priority=0:\
              :ignoretime:
          EOF
          sudo usermod -L unlimited runner
      - name: Run tests
        run: |
          set -x
          sudo su -c unlimited -s /usr/local/bin/bash -l runner <<EOF
          set -x
          export AWS_LC_GO_TEST_TIMEOUT=${AWS_LC_GO_TEST_TIMEOUT}
          cd $(pwd)
          export PATH="${HOME}/bin:${PATH}"
          env
          tests/ci/run_bsd_tests.sh
          EOF

  netbsd:
    if: github.repository_owner == 'aws' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: NetBSD ${{ matrix.version }} (${{ matrix.arch }}) test
    strategy:
      fail-fast: false
      matrix:
        arch:
          - "x86-64"
          - "arm64"
        version:
          - "10.1"
    defaults:
      run:
        shell: cpa.sh {0}
    env:
      AWS_LC_GO_TEST_TIMEOUT: 90m
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Start VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641
        with:
          environment_variables: "AWS_LC_GO_TEST_TIMEOUT GOFLAGS"
          operating_system: netbsd
          architecture: ${{ matrix.arch }}
          version: ${{ matrix.version }}
          shell: bash
          memory: 12G
          cpu_count: 3
      - name: Install dependencies
        run: |
          set -x
          source tests/ci/retry_util.sh
          export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/${{ (matrix.arch == 'arm64' && 'aarch64') || 'x86_64' }}/${{ matrix.version }}/All"
          retry_with_backoff sudo -E pkg_add -u curl cmake gmake perl mozilla-rootcerts
          ARCH=${{ (matrix.arch == 'x86-64' && 'amd') || 'arm' }}
          export PATH="/usr/pkg/bin:/usr/pkg/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
          retry_with_backoff curl -fL -O https://dl.google.com/go/go1.25.2.netbsd-${ARCH}64.tar.gz
          sudo mkdir -p /usr/local
          sudo tar -C /usr/local -xzf go1.25.2.netbsd-${ARCH}64.tar.gz
      - name: Run tests
        run: |
          set -x
          export PATH="/usr/pkg/bin:/usr/pkg/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
          export GOROOT=/usr/local/go
          export PATH="$PATH:$GOROOT/bin"
          tests/ci/run_bsd_tests.sh

  report-failures:
    name: report-failures
    needs: [freebsd, OpenBSD, netbsd]
    if: ${{ always() && github.event_name == 'schedule' && github.repository_owner == 'aws' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on:
      - codebuild-aws-lc-ci-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        image:linux-5.0
        instance-size:small
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-aws-credentials
      - uses: ./.github/actions/report-workflow-failures
        with:
          metric-name: BsdCiFailure
          infrastructure-metric-name: BsdCiInfrastructureFailure
          infrastructure-steps: |
            Start VM
            Install dependencies
