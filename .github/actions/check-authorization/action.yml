name: 'check-authorization'
description: 'A helper action to determine the authorization level of a pull request for running CI'
outputs:
  approval-env:
    description: 'The target environment to use for the workflow'
    value: ${{ steps.collab-check.outputs.result }}
runs:
  using: 'composite'
  steps:
    - name: Collaborator Check
      uses: actions/github-script@v8
      id: collab-check
      with:
        result-encoding: string
        script: |
          // Skip authorization check if event is not pull_request_target
          if (context.eventName !== 'pull_request_target') {
            console.log(`Event type is ${context.eventName}, skipping authorization check`);
            return "auto-approve";
          }
          
          const prAuthor = context.payload.pull_request.user.login;
          const prPusher = context.payload.sender.login;
          const usersToCheck = [prAuthor, prPusher];
          
          for (const username of usersToCheck) {
            try {
              const permissionResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              const permission = permissionResponse.data.permission;
              const hasWriteAccess = ['write', 'admin'].includes(permission);
              if (!hasWriteAccess) {
                console.log(`User ${username} does not have write access to the repository (permission: ${permission}). Requiring Manual Approval to run PR Checks.`);
                return "manual-approval";
              }
              console.log(`Verified ${username} has write access.`);
            } catch (error) {
              console.log(`Could not verify write access for ${username}. Requiring Manual Approval to run PR Checks.`);
              return "manual-approval";
            }
          }
          
          console.log(`Verified all of [${usersToCheck.join(", ")}] have write access. Auto Approving PR Checks.`);
          return "auto-approve";
